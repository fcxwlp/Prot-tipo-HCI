<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giro · Simulador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--muted:#6B7079;--line:#ECEDEF;--soft:#F5F6F7;--blue:#3B5BFF;--tint:#EEF1FF;--teal:#0E9384;--orange:#E8622C;
--g:#12B76A;--gbg:#ECFDF3;--gfg:#067647;--a:#F79009;--abg:#FFFAEB;--afg:#B54708;--r:#F04438;--rbg:#FEF3F2;--rfg:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:#EEF0F3;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(260px,320px) auto minmax(260px,340px);gap:32px;justify-content:center;align-items:start;padding:28px 24px 40px;min-height:100vh}
.panel{background:#fff;border:1px solid #E1E4E8;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.panel h2{margin:0;font-size:16px;letter-spacing:-.2px}
.panel p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow b{font-size:20px;letter-spacing:-.5px}
.brandrow span{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft);padding:3px 8px;border-radius:999px}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl label{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;border-radius:999px;height:32px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pbtn{height:40px;border-radius:12px;border:1px solid #DCDEE2;background:#fff;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn:hover{border-color:#B9BEC7}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn img{height:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--blue)}
.log{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;font-size:12px}
.log div{display:flex;gap:8px;line-height:1.4}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.help h3{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}
.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.help li{font-size:13px;line-height:1.5;color:#3A3F47}
.help li b{color:var(--ink)}
.kbd{display:inline-block;font-size:11px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* phone */
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{background:#111214;border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(17,18,20,.22)}
.screen{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:#fff}
.sbar{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;z-index:30;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:34px}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:12px 24px 24px;display:flex;flex-direction:column;gap:20px}
.mark{border-radius:999px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
h1.t{margin:0;font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.sub{margin:0;font-size:15px;color:var(--muted);line-height:1.45}
.btn{height:54px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-size:16px;font-weight:600;width:100%}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #111}
.btn.green{background:var(--g)}
.back{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:6px}.dots span{width:24px;height:4px;border-radius:999px;background:var(--line)}.dots span.on{background:var(--blue)}
.pcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-align:left}
.pcard.on{border-color:var(--blue)}
.logo{width:56px;height:48px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.logo img{max-width:40px;max-height:32px}
.ck{width:24px;height:24px;border-radius:999px;border:1.5px solid #C9CCD1;display:flex;align-items:center;justify-content:center;flex:none}
.on .ck{background:var(--blue);border-color:var(--blue)}
.hr{height:1px;background:var(--line)}
.sw{flex:none;width:50px;height:30px;border-radius:999px;border:0;padding:3px;display:flex;justify-content:flex-start;background:#C9CCD1;transition:background .15s}
.sw.on{justify-content:flex-end;background:var(--blue)}
.sw span{width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input{height:50px;border-radius:12px;border:1px solid #DCDEE2;font-size:17px;font-weight:600;padding:0 14px;width:100%;color:var(--ink);background:#fff}
.field input:focus{outline:2px solid var(--blue);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.big{font-size:48px;font-weight:700;letter-spacing:-1.6px;line-height:1.05;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.sec{font-size:13px;font-weight:600;color:var(--muted)}
.split{height:8px;display:flex;gap:2px}.split i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px}.legend span{display:flex;align-items:center;gap:6px}.sq{width:8px;height:8px;border-radius:2px;display:inline-block}
.ride{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:999px;flex:none}
.link{border:0;background:none;padding:0;color:var(--blue);font-size:12px;font-weight:600}
.nav{height:72px;flex:none;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500}
.nav button.on{color:var(--blue);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;font-weight:700}
.pill.green{background:var(--gbg);color:var(--gfg)}.pill.amber{background:var(--abg);color:var(--afg)}.pill.red{background:var(--rbg);color:var(--rfg)}
.chip{display:inline-flex;align-items:center;height:26px;border:1px solid var(--line);border-radius:999px;padding:0 10px;background:#fff}
.chip img{height:14px}
.waiting{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--tint);color:#2A44D9;font-size:13px;font-weight:600}
.pulse{width:10px;height:10px;border-radius:999px;background:var(--blue);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(59,91,255,.5)}100%{box-shadow:0 0 0 12px rgba(59,91,255,0)}}
.tripbanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#111;color:#fff;border:0;width:100%;text-align:left}
/* host app */
.host{position:absolute;inset:0;background:#E6E9ED;display:flex;flex-direction:column;padding-top:34px}
.hostmap{position:absolute;inset:0}
.hostlabel{position:absolute;left:16px;font-size:11px;font-weight:600;color:#4A515B;background:#fff;border-radius:999px;padding:5px 10px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.sheet .row{display:flex;justify-content:space-between;font-size:15px}.sheet .row span:first-child{color:#4A515B}.sheet .row span:last-child{font-weight:600}
.timer{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative}
.hbtn{height:56px;border-radius:14px;font-size:16px;font-weight:700}
.hbtn.no{border:2px solid #C9CED4;background:#fff;color:#1F2328}.hbtn.yes{border:0;background:#1F2328;color:#fff}
.ov{position:absolute;left:16px;right:16px;top:44px;display:flex;flex-direction:column;gap:8px;z-index:20}
.gcard{background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(17,17,17,.2);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.gcard.sel{border-color:#111}
.gcard .top{height:4px}
.gcard .in{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.ibtn{width:34px;height:34px;border-radius:999px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center}
.minipill{position:absolute;right:16px;top:44px;z-index:20;height:44px;border-radius:999px;border:0;background:#fff;box-shadow:0 12px 32px rgba(17,17,17,.2);display:flex;align-items:center;gap:8px;padding:0 16px 0 6px}
.prog{height:8px;border-radius:999px;background:#E4E6EA;overflow:hidden}.prog i{display:block;height:100%;background:#1F2328;transition:width 1s linear}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;color:#9AA0A8}
.step.on{color:#1F2328;font-weight:600}.step.done{color:#4A515B}
.step i{width:10px;height:10px;border-radius:999px;background:#D5D8DD;flex:none}.step.on i{background:#1F2328}.step.done i{background:var(--g)}
/* modal */
.modal{position:absolute;inset:0;background:rgba(17,17,17,.4);display:flex;align-items:flex-end;z-index:50}
.msheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px}
.tipbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tipbtns button{height:52px;border-radius:12px;border:1.5px solid #DCDEE2;background:#fff;font-size:16px;font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:500;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
/* charts */
.week{display:flex;align-items:center;justify-content:space-between}
.arrow{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.arrow:disabled{opacity:.35;cursor:default}
.days{position:relative;height:150px;border-bottom:1px solid #DCDEE2;display:grid;grid-template-columns:repeat(7,1fr);align-items:end}
.days button{height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end;justify-content:center}
.days button i{display:block;width:26px;border-radius:4px 4px 0 0}
.meta{position:absolute;left:0;right:0;border-top:1.5px dashed #8A8F98;pointer-events:none}
.metal{position:absolute;right:0;font-size:11px;color:var(--muted);background:#fff;padding-left:4px;pointer-events:none}
.dlabels{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;margin-top:-12px}
.hrow{display:flex;align-items:center;gap:10px;height:22px;font-size:12px}
.hrow .n{width:44px;color:var(--muted);font-variant-numeric:tabular-nums}.hrow .t{flex:1;height:12px}.hrow .t i{display:block;height:100%;border-radius:0 4px 4px 0}.hrow .v{width:60px;text-align:right;font-variant-numeric:tabular-nums}
/* map */
.mapbox{position:relative;height:440px;flex:none;overflow:hidden;background:#F2F2F2}
.mapbox img{position:absolute;left:0;top:0;width:390px;height:440px}
.mapbox svg{position:absolute;left:0;top:0}
.mapbox polygon{cursor:pointer}
.fchip{height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #DCDEE2;background:#fff;color:var(--ink)}
.fchip.on{background:#111;color:#fff;border-color:#111}
.segm{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.segm button{height:36px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.segm button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.prow input{width:96px;height:38px;border:1px solid #DCDEE2;border-radius:10px;text-align:right;padding:0 10px;font-size:15px;font-weight:600}
.prow input:focus{outline:2px solid var(--blue);outline-offset:1px}
@media (max-width:1180px){.layout{grid-template-columns:auto;justify-items:center}.panel{position:static;width:100%;max-width:440px}.phonewrap{order:-1}}
@media (max-width:460px){.layout{padding:0 0 24px;gap:16px}.phone{padding:0;border-radius:0;box-shadow:none}.screen{border-radius:0;width:100vw;height:100svh}.panel{border-radius:0;border-left:0;border-right:0}}
</style>
</head>
<body>
<div class="layout">
  <aside class="panel" id="ctrl"></aside>
  <div class="phonewrap"><div class="phone"><div class="screen" id="screen"></div></div></div>
  <aside class="panel help" id="help"></aside>
</div>

function liveToday(){
  const T=today(); const on=S.runMin+S.waitMin;
  if(!S.shift && !S.rides.length) return {d:'2026-11-05',dow:3,off:true};
  const st=S.shift?S.shift.start:(S.rides.length?S.rides[S.rides.length-1].t-30:600), en=st+on;
  const SL=[8,10,12,14,16,18,20,22]; const smin=SL.map(h=>Math.max(0,Math.min(en,(h+2)*60)-Math.max(st,h*60)));
  const slots=[0,0,0,0,0,0,0,0]; S.rides.forEach(r=>{const k=Math.max(0,Math.min(7,Math.floor((Math.floor(r.t/60)-8)/2)));slots[k]+=r.sobra+r.tip});
  return {d:'2026-11-05',dow:3,off:false,sobra:T.sobra,recebeu:T.recebeu,gastou:T.gastou,km:T.kmT,rides:T.n,online:on,run:S.runMin,acc:T.n,ref:S.refused,exp:S.expired,slots,smin,ifb:T.byP.ifood.v,n9b:T.byP.n99.v,ifc:T.byP.ifood.n,n9c:T.byP.n99.n,start:st,end:en};
}
function allDays(){return MOCKDAYS.filter(d=>d.d!=='2026-11-05').concat([liveToday()])}

  return `<div class="host">${hostMap()}<div class="hostlabel" style="top:${S.offers.length>1?470:456}px">Simulação do app ${PNAME[cur.p]} para entregadores</div>${sheet}${ov}</div>`;

// --------------- events ----------------
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;
  const el=e.target.closest('[data-a]'); if(!el)return;
  const [a,b,c]=el.dataset.a.split(':');
  if(el.tagName==='INPUT')return;
  switch(a){
    case 'go':S.screen=b;break;
    case 'app':S.apps[b]=!S.apps[b];break;
    case 'perm':S.perm=true;break;
    case 'share':S.share=!S.share;break;
    case 'next': if(b==='apps'){if(!S.apps.ifood&&!S.apps.n99){toast('Marque pelo menos um app.');break} if(!S.perm){toast('Dê a permissão para o Giro aparecer nas ofertas.');break} S.screen='moto'} else {S.screen='app';S.tab='hoje';log('Cadastro concluído')} break;
    case 'skip':S.screen='app';S.perm=true;S.tab='hoje';log('Cadastro pulado');break;
    case 'tab':S.tab=b;S.view='giro';break;
    case 'view':S.view=b;break;
    case 'start':S.shift={start:S.clock};S.rides=[];S.seen=0;S.refused=0;S.expired=0;S.runMin=0;S.waitMin=0;log('Turno iniciado');toast('Turno iniciado. As ofertas vão começar a chegar.');break;
    case 'end':{const T=today();let best=null;S.rides.forEach(r=>{if(!best||r.rkm>best.rkm)best=r});S.offers=[];S.trip=null;S.modal={k:'resumo',r:{...T,best,seen:S.seen,on:S.runMin+S.waitMin,run:S.runMin,exp:S.expired}};log('Turno encerrado');break}
    case 'closeResumo':S.modal=null;S.shift=null;S.view='giro';S.tab='hoje';break;
    case 'spawn':spawn(b==='both'?['ifood','n99']:[b]);return;
    case 'speed':S.speed=+b;break;
    case 'accept':decide(+b,true);return;
    case 'refuse':decide(+b,false);return;
    case 'finish':{const left=Math.max(0,Math.ceil(S.trip.o.min*(1-S.trip.done)));S.clock+=left;S.runMin+=left;S.trip.done=1;finishTrip();break}
    case 'mini':S.mini=b==='1';break;
    case 'sel':S.sel=+b;break;
    case 'tip':S.modal={k:'tip',id:+b};break;
    case 'tipset':{const r=S.rides.find(r=>r.id==b);r.tip=+c;S.modal=null;if(+c)log(`Gorjeta ${brl(+c)} somada`);break}
    case 'close':if(e.target===el||el.tagName==='BUTTON')S.modal=null;else return;break;
    case 'pk':S.pkind=b;S.pidx=0;S.daySel=null;break;
    case 'pidx':S.pidx=Math.max(0,S.pidx+(+b));S.daySel=null;break;
    case 'day':S.daySel=+b;break;
    case 'win':S.mapWin=b;break;
    case 'plat':S.mapPlat=b;break;
    case 'hex':S.mapSel=b;break;
    case 'goto':S.loc=b;log(`Foi para ${locHex().n}`);toast(`Você está em ${locHex().n}.`);break;
    case 'reset':S=S0();break;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{if(e.target.matches('[data-a="auto"]')){S.auto=e.target.checked;render()}});
document.addEventListener('input',e=>{
  const k=e.target.dataset.cfg; if(!k)return; const v=num(e.target.value); if(v===null||v<0)return;
  if(k==='kmL'&&v===0)return; S.cfg[k]=v;
  document.querySelectorAll('[data-bind="ckm"]').forEach(x=>x.textContent=brl(costKm()));
  document.querySelectorAll('[data-bind="formula"]').forEach(x=>x.textContent=formula());
  document.querySelectorAll('[data-bind="metaTxt"]').forEach(x=>x.textContent=metaTxt());
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal&&S.modal.k==='tip'){S.modal=null;render()}});
function fit(){const ph=document.querySelector('.phone');if(innerWidth<=460){ph.style.zoom='';return}const z=Math.min(1,(innerHeight-40)/868);ph.style.zoom=z<0.7?0.7:z}
addEventListener('resize',fit); fit(); render();
</script>
</body>
</html>
